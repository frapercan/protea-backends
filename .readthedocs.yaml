# ReadTheDocs build configuration for protea-backends.
# Manual one-time step: import the repo on readthedocs.org with slug
# "protea-backends" (https://protea-backends.readthedocs.io).
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    # No `docs` pip extra exists (the docs dependencies live in the
    # Poetry `docs` group), so install exactly the Sphinx tooling that
    # conf.py needs right before the build. The heavy ML libraries
    # (torch, transformers, sentencepiece, esm) are optional Poetry
    # extras and stay uninstalled: conf.py mocks them via
    # autodoc_mock_imports, so the build stays fast.
    pre_build:
      - pip install 'sphinx>=7.3' 'shibuya>=2024.10' 'sphinx-copybutton>=0.5' 'sphinx-design>=0.5'

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true

python:
  install:
    # Installs protea-backends plus its lightweight runtime deps (numpy,
    # protea-contracts). Provides package metadata for autodoc.
    - method: pip
      path: .
